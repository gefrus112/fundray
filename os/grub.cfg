set default=0
set timeout=3

menuentry "Fundray Linux 1.0" {
    linux /boot/vmlinuz loglevel=4 console=tty0 console=ttyS0
    initrd /boot/initramfs.gz
}

menuentry "Fundray Linux 1.0 (serial console only)" {
    linux /boot/vmlinuz loglevel=4 console=ttyS0
    initrd /boot/initramfs.gz
}

menuentry "Fundray Linux 1.0 (verbose boot log)" {
    linux /boot/vmlinuz loglevel=7 console=tty0 console=ttyS0
    initrd /boot/initramfs.gz
}
